    display_name: 'GPT-4.1'
    credit_multiplier: 3
  gpt-4.1-mini:
    provider: openai
    display_name: 'GPT-4.1 Mini'
    credit_multiplier: 1
  gpt-4.1-nano:
    provider: openai
    display_name: 'GPT-4.1 Nano'
    credit_multiplier: 1
  gpt-5.1:
    provider: openai
    display_name: 'GPT-5.1'
    credit_multiplier: 2
  gpt-5-mini:
    provider: openai
    display_name: 'GPT-5 Mini'
    credit_multiplier: 1
  gpt-5-nano:
    provider: openai
    display_name: 'GPT-5 Nano'
    credit_multiplier: 1
  gpt-5.2:
    provider: openai
    display_name: 'GPT-5.2'
    credit_multiplier: 3
  claude-haiku-4.5:
    provider: anthropic
    display_name: 'Claude Haiku 4.5'
